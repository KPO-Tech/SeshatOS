name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base ref, running everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$CHANGED"
          echo "backend=$(echo "$CHANGED" | grep -qE '^(seshat-backend/|go\.work|\.github/workflows/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "desktop=$(echo "$CHANGED" | grep -q '^seshat-desktop/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Build
        run: go build ./seshat-backend/...

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Tests
        run: go test ./seshat-backend/... -timeout 10m

      - name: Race-sensitive tests
        run: |
          go test -race -timeout 8m \
            ./seshat-backend/internal/config \
            ./seshat-backend/internal/documentreading \
            ./seshat-backend/internal/files \
            ./seshat-backend/internal/query

  # The app is used on Windows: paths, processes and file locking behave differently there, and nothing else in this workflow runs on it.
  test-windows:
    name: Test (Windows)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Tests
        run: go test ./seshat-backend/... -timeout 20m

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(find . -name "*.go" | xargs gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./seshat-backend/...

      - name: actionlint (the workflows)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m ./seshat-backend/...

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      # gosec is installed with the Go of the repository, not run through the securego/gosec action: the action runs an image with its
      # own Go, which cannot load the packages once go.work asks for a newer one. Triaged on 2026-11-07: the 21 findings of high
      # severity were read one by one; two were real (a size announced by an archive header that wrapped around, a file opened in a
      # directory walk without checking it was the file listed) and are fixed, the others carry a "#nosec <rule> -- <why>" next to the
      # line. From now on a new finding of high severity fails the job. The medium and low ones are not triaged yet and are only reported.
      - name: gosec (high severity fails the job)
        working-directory: seshat-backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -exclude-generated -severity high ./...

      - name: gosec (medium and low, reported)
        working-directory: seshat-backend
        run: gosec -exclude-generated -no-fail ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          (cd seshat-backend && govulncheck ./...)

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seshat-desktop/package-lock.json

      - name: Install dependencies
        working-directory: seshat-desktop
        run: npm ci

      - name: Typecheck
        working-directory: seshat-desktop
        run: npm run typecheck

      - name: Lint
        working-directory: seshat-desktop
        run: npm run lint

      - name: Tests
        working-directory: seshat-desktop
        run: npm test

      - name: Build
        working-directory: seshat-desktop
        run: npm run build

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR branch flow
        # The names of the branches come from outside (a pull request from a fork chooses its own): they are read from the
        # environment, never written into the text of the script, where a name with a quote in it would run as code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && \
                "$BASE_REF" == "main" && \
                "$HEAD_REF" != "dev" ]]; then
            echo "Pull requests targeting main must come from dev."
            echo "Current head branch: $HEAD_REF"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$BASE_REF" == "dev" ]]; then
            case "$HEAD_REF" in
              feat/*|feature/*|fix/*|bugfix/*|docs/*|refactor/*|test/*|chore/*|perf/*|ci/*|dependabot/*)
                ;;
              *)
                echo "Pull requests targeting dev must come from a typed topic branch."
                echo "Allowed prefixes: feat/, feature/, fix/, bugfix/, docs/, refactor/, test/, chore/, perf/, ci/, dependabot/"
                echo "Current head branch: $HEAD_REF"
                exit 1
                ;;
            esac
          fi

          echo "Branch policy check passed."

  # A seshat-runtime release lands with no commit here, so a stale pin stays
  # invisible unless something looks for it. No path filter and no `needs: changes`
  # on purpose: this is about the dependency, not about the files a pull request
  # happens to touch. Dependabot's weekly pull requests are the heartbeat that
  # keeps this job running on a repository where nothing else would.
  runtime-pin:
    name: Runtime pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Check the seshat-runtime pin
        run: bash scripts/check-runtime-pin.sh

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [changes, build, test, test-windows, lint, security, desktop, runtime-pin, branch-policy]
    if: always()
    steps:
      - name: All checks passed
        run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if ! ok "${{ needs.build.result }}" || \
             ! ok "${{ needs.test.result }}" || \
             ! ok "${{ needs.test-windows.result }}" || \
             ! ok "${{ needs.lint.result }}" || \
             ! ok "${{ needs.security.result }}" || \
             ! ok "${{ needs.desktop.result }}" || \
             [[ "${{ needs.changes.result }}" != "success" ]] || \
             [[ "${{ needs.runtime-pin.result }}" != "success" ]] || \
             [[ "${{ needs.branch-policy.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            echo "  changes:       ${{ needs.changes.result }}"
            echo "  build:         ${{ needs.build.result }}"
            echo "  test:          ${{ needs.test.result }}"
            echo "  test-windows:  ${{ needs.test-windows.result }}"
            echo "  lint:          ${{ needs.lint.result }}"
            echo "  security:      ${{ needs.security.result }}"
            echo "  desktop:       ${{ needs.desktop.result }}"
            echo "  runtime-pin:   ${{ needs.runtime-pin.result }}"
            echo "  branch-policy: ${{ needs.branch-policy.result }}"
            exit 1
          fi
          echo "All checks passed."
