name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base ref, running everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "$CHANGED"
          echo "backend=$(echo "$CHANGED" | grep -qE '^(seshat-backend/|go\.work)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "desktop=$(echo "$CHANGED" | grep -q '^seshat-desktop/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Build
        run: go build ./seshat-backend/...

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Tests
        run: go test ./seshat-backend/... -timeout 10m

      - name: Race-sensitive tests
        run: |
          go test -race -timeout 8m \
            ./seshat-backend/internal/config \
            ./seshat-backend/internal/documentreading \
            ./seshat-backend/internal/files \
            ./seshat-backend/internal/query

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(find . -name "*.go" | xargs gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./seshat-backend/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m ./seshat-backend/...

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: gosec
        uses: securego/gosec@master
        with:
          args: -exclude-generated ./seshat-backend/...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd seshat-backend && govulncheck ./...)

  desktop:
    name: Desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seshat-desktop/package-lock.json

      - name: Install dependencies
        working-directory: seshat-desktop
        run: npm ci

      - name: Typecheck
        working-directory: seshat-desktop
        run: npm run typecheck

      - name: Lint
        working-directory: seshat-desktop
        run: npm run lint

      - name: Tests
        working-directory: seshat-desktop
        run: npm test

      - name: Build
        working-directory: seshat-desktop
        run: npm run build

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR branch flow
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "main" && \
                "${{ github.head_ref }}" != "dev" ]]; then
            echo "Pull requests targeting main must come from dev."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "dev" ]]; then
            case "${{ github.head_ref }}" in
              feat/*|feature/*|fix/*|bugfix/*|docs/*|refactor/*|test/*|chore/*|perf/*|ci/*|dependabot/*)
                ;;
              *)
                echo "Pull requests targeting dev must come from a typed topic branch."
                echo "Allowed prefixes: feat/, feature/, fix/, bugfix/, docs/, refactor/, test/, chore/, perf/, ci/, dependabot/"
                echo "Current head branch: ${{ github.head_ref }}"
                exit 1
                ;;
            esac
          fi

          echo "Branch policy check passed."

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [changes, build, test, lint, security, desktop, branch-policy]
    if: always()
    steps:
      - name: All checks passed
        run: |
          ok() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if ! ok "${{ needs.build.result }}" || \
             ! ok "${{ needs.test.result }}" || \
             ! ok "${{ needs.lint.result }}" || \
             ! ok "${{ needs.security.result }}" || \
             ! ok "${{ needs.desktop.result }}" || \
             [[ "${{ needs.changes.result }}" != "success" ]] || \
             [[ "${{ needs.branch-policy.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            echo "  changes:       ${{ needs.changes.result }}"
            echo "  build:         ${{ needs.build.result }}"
            echo "  test:          ${{ needs.test.result }}"
            echo "  lint:          ${{ needs.lint.result }}"
            echo "  security:      ${{ needs.security.result }}"
            echo "  desktop:       ${{ needs.desktop.result }}"
            echo "  branch-policy: ${{ needs.branch-policy.result }}"
            exit 1
          fi
          echo "All checks passed."
