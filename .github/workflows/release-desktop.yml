name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check the tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # electron-updater compares the version inside the installer with the one in latest.yml: a tag that disagrees with
      # seshat-desktop/package.json publishes installers named after one version and metadata claiming another, and the app
      # then offers an update to itself or never sees one.
      - name: Compare tag and package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./seshat-desktop/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match seshat-desktop/package.json version $version"
            exit 1
          fi

  # Linux and Windows build their backend inside their own packaging job, with the native OCR (it needs a C compiler of the target
  # system, so it cannot be cross-built). macOS keeps the plain backend built here: the native OCR is not packaged for it yet.
  build-backend:
    name: Build backend (${{ matrix.suffix }})
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            binary_name: seshat-backend
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            binary_name: seshat-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - name: Build seshat-backend
        working-directory: seshat-backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/${{ matrix.binary_name }} \
            ./cmd/api

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.suffix }}
          path: seshat-backend/dist/${{ matrix.binary_name }}

  package-linux:
    name: Package Linux (AppImage, deb)
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: seshat-desktop
        run: npm ci

      # The backend with the native OCR (pdfium, ONNX Runtime). The script fetches the native libraries at the versions pinned by the
      # runtime, builds with CGO and copies libpdfium.so next to the backend; the app puts that folder on LD_LIBRARY_PATH.
      - name: Build backend with native OCR
        env:
          SESHAT_BUILD_VERSION: ${{ github.ref_name }}
        run: node scripts/build-desktop-sidecar.mjs linux amd64 --nativedoc

      - name: Check the native OCR files are there
        run: |
          ls -la seshat-desktop/resources/backend
          test -x seshat-desktop/resources/backend/seshat-backend
          test -f seshat-desktop/resources/backend/libpdfium.so
          test -f seshat-desktop/resources/backend/.nativedoc-enabled

      # What a release shows: public hides what is not ready (accounts, SeshatCloud), see
      # seshat-desktop/src/renderer/lib/edition.ts. Everything else, the app on the main branch included, shows it all: change this
      # one value, in the three build steps, to release with more or less.
      - name: Build renderer/main
        working-directory: seshat-desktop
        env:
          VITE_SESHAT_EDITION: public
        run: npm run build

      - name: Package (AppImage + deb)
        working-directory: seshat-desktop
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            seshat-desktop/dist/*.AppImage
            seshat-desktop/dist/*.deb
            seshat-desktop/dist/latest-linux.yml

  package-windows:
    name: Package Windows (NSIS)
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: seshat-desktop
        run: npm ci

      # CGO needs a MinGW-w64 C compiler on PATH; the script runs the native library setup with the Git for Windows bash.
      - name: Check the C compiler
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            for dir in /c/mingw64/bin /c/msys64/mingw64/bin /c/ProgramData/mingw64/mingw64/bin; do
              if [ -x "$dir/gcc.exe" ]; then echo "$dir" >> "$GITHUB_PATH"; echo "found gcc in $dir"; exit 0; fi
            done
            echo "::error::no gcc on this runner: install MinGW-w64 before the native OCR build"
            exit 1
          fi
          gcc --version | head -1

      # The backend with the native OCR: built here because CGO cannot be cross-built. pdfium.dll and onnxruntime.dll are copied next
      # to seshat-backend.exe, where Windows looks for them first.
      - name: Build backend with native OCR
        shell: bash
        env:
          SESHAT_BUILD_VERSION: ${{ github.ref_name }}
        run: node scripts/build-desktop-sidecar.mjs windows amd64 --nativedoc

      - name: Check the native OCR files are there
        shell: bash
        run: |
          ls -la seshat-desktop/resources/backend
          test -f seshat-desktop/resources/backend/seshat-backend.exe
          test -f seshat-desktop/resources/backend/pdfium.dll
          test -f seshat-desktop/resources/backend/onnxruntime.dll
          test -f seshat-desktop/resources/backend/.nativedoc-enabled

      # What a release shows: public hides what is not ready (accounts, SeshatCloud), see
      # seshat-desktop/src/renderer/lib/edition.ts. Everything else, the app on the main branch included, shows it all: change this
      # one value, in the three build steps, to release with more or less.
      - name: Build renderer/main
        working-directory: seshat-desktop
        env:
          VITE_SESHAT_EDITION: public
        run: npm run build

      # Signed when a certificate is configured in the repository secrets (WIN_CSC_LINK: the .pfx as a base64 string or a URL,
      # WIN_CSC_KEY_PASSWORD: its password). Without them the installer is built unsigned, as before: Windows SmartScreen then
      # warns on the first launch.
      - name: Package (NSIS)
        working-directory: seshat-desktop
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          # The executable gets its icon and version information in both cases (signAndEditExecutable); only the signature depends on
          # the certificate.
          if [ -n "$CSC_LINK" ]; then
            echo "Signing the installer and the executable"
          else
            echo "::warning::no WIN_CSC_LINK secret: the Windows installer is not signed"
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --win nsis --publish never --config.win.signAndEditExecutable=true

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            seshat-desktop/dist/*.exe
            seshat-desktop/dist/*.exe.blockmap
            seshat-desktop/dist/latest.yml

  # macOS: a disk image per processor. Experimental: nobody has run it on a Mac yet, and it is not signed (no Apple developer
  # account), so macOS asks to confirm the first launch. A failure here does not stop the release: the publish job takes whatever
  # was built. An AppImage cannot run on macOS, this is the macOS package.
  package-macos:
    name: Package macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: build-backend
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            backend: darwin-amd64
          - arch: arm64
            backend: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: seshat-desktop
        run: npm ci

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.backend }}
          path: seshat-desktop/resources/backend

      - name: Make backend binary executable
        run: chmod +x seshat-desktop/resources/backend/seshat-backend

      # What a release shows: public hides what is not ready (accounts, SeshatCloud), see
      # seshat-desktop/src/renderer/lib/edition.ts. Everything else, the app on the main branch included, shows it all: change this
      # one value, in the three build steps, to release with more or less.
      - name: Build renderer/main
        working-directory: seshat-desktop
        env:
          VITE_SESHAT_EDITION: public
        run: npm run build

      - name: Package (dmg)
        working-directory: seshat-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos-${{ matrix.arch }}
          path: seshat-desktop/dist/*.dmg

  publish:
    name: Publish GitHub Release
    needs: [package-linux, package-windows, package-macos]
    # The macOS job may fail without failing the release; Linux and Windows may not. Only a tag publishes: a manual run
    # (workflow_dispatch) builds the installers and keeps them as artifacts, which is how a change to this workflow is tried.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.package-linux.result == 'success' && needs.package-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

