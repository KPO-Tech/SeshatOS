<svg xmlns="http://www.w3.org/2000/svg" width="680" height="655" viewBox="0 0 680 655" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Knowledge agent workflow</title>
<desc id="d">A question goes from the Ask composer to a chat session with the built-in knowledge agent, which has two read-only tools (search and read), searches the knowledge backend up to four times, and returns an answer whose refs the Ask view turns into citation chips.</desc>
<style>
:root{--ink:#2c2c2a;--ink2:#5f5e5a;--line:#888780;--card:#ffffff;--teal-f:#e1f5ee;--teal-s:#0f6e56;--teal-t:#085041;--pur-f:#eeedfe;--pur-s:#534ab7;--pur-t:#3c3489;--gray-f:#f1efe8;--gray-s:#5f5e5a}
@media (prefers-color-scheme:dark){:root{--ink:#e8e6dc;--ink2:#b4b2a9;--line:#888780;--card:#2c2c2a;--teal-f:#04342c;--teal-s:#5dcaa5;--teal-t:#9fe1cb;--pur-f:#26215c;--pur-s:#afa9ec;--pur-t:#cecbf6;--gray-f:#3a3a37;--gray-s:#b4b2a9}}
.th{font-size:14px;font-weight:500;fill:var(--ink)}.ts{font-size:12px;fill:var(--ink2)}
.box rect{fill:var(--card);stroke:var(--line);stroke-width:.5}
.teal>rect{fill:var(--teal-f);stroke:var(--teal-s);stroke-width:.5}.teal>text{fill:var(--teal-t)}
.pur>rect{fill:var(--pur-f);stroke:var(--pur-s);stroke-width:.5}.pur>text{fill:var(--pur-t)}
.gray rect{fill:var(--gray-f);stroke:var(--gray-s);stroke-width:.5}
.arr{stroke:var(--line);stroke-width:1.5;fill:none}.path{stroke:var(--line);stroke-width:1.5;fill:none}
.cap{font-size:12px;fill:var(--ink2)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="teal"><rect x="40" y="40" width="600" height="100" rx="12"/><text class="ts" x="628" y="58" text-anchor="end">Desktop, Ask view</text></g>
<g class="box"><rect x="60" y="80" width="170" height="48" rx="8"/><text class="th" x="145" y="97" text-anchor="middle" dominant-baseline="central">Ask composer</text><text class="ts" x="145" y="115" text-anchor="middle" dominant-baseline="central">question + collection</text></g>
<g class="box"><rect x="255" y="80" width="170" height="48" rx="8"/><text class="th" x="340" y="97" text-anchor="middle" dominant-baseline="central">Chat session</text><text class="ts" x="340" y="115" text-anchor="middle" dominant-baseline="central">agent_slug = knowledge</text></g>
<g class="pur"><rect x="40" y="170" width="600" height="175" rx="12"/><text class="ts" x="628" y="188" text-anchor="end">Backend, runtime</text></g>
<g class="box"><rect x="60" y="208" width="170" height="48" rx="8"/><text class="th" x="145" y="225" text-anchor="middle" dominant-baseline="central">Built-in agent</text><text class="ts" x="145" y="243" text-anchor="middle" dominant-baseline="central">defined in code</text></g>
<g class="box"><rect x="255" y="208" width="170" height="48" rx="8"/><text class="th" x="340" y="225" text-anchor="middle" dominant-baseline="central">Own prompt</text><text class="ts" x="340" y="243" text-anchor="middle" dominant-baseline="central">no memories, no web</text></g>
<g class="box"><rect x="450" y="208" width="170" height="48" rx="8"/><text class="th" x="535" y="225" text-anchor="middle" dominant-baseline="central">Two tools only</text><text class="ts" x="535" y="243" text-anchor="middle" dominant-baseline="central">search and read</text></g>
<g class="box"><rect x="60" y="272" width="560" height="56" rx="8" stroke-dasharray="4 3"/><text class="th" x="340" y="291" text-anchor="middle" dominant-baseline="central">Collection limit applied by the tools</text><text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central">not left to the model</text></g>
<rect x="40" y="365" width="600" height="115" rx="12" fill="none" stroke="var(--line)" stroke-width=".5" stroke-dasharray="4 3"/><text class="ts" x="628" y="383" text-anchor="end">One turn</text>
<g class="gray"><rect x="60" y="400" width="170" height="48" rx="8"/><text class="th" x="145" y="417" text-anchor="middle" dominant-baseline="central">Model</text><text class="ts" x="145" y="435" text-anchor="middle" dominant-baseline="central">decides what to search</text></g>
<g class="pur"><rect x="255" y="400" width="170" height="48" rx="8"/><text class="th" x="340" y="417" text-anchor="middle" dominant-baseline="central">Search and read</text><text class="ts" x="340" y="435" text-anchor="middle" dominant-baseline="central">read only, no prompt</text></g>
<g class="gray"><rect x="450" y="400" width="170" height="48" rx="8"/><text class="th" x="535" y="417" text-anchor="middle" dominant-baseline="central">Knowledge backend</text><text class="ts" x="535" y="435" text-anchor="middle" dominant-baseline="central">local or SeshatCloud</text></g>
<text class="cap" x="450" y="468">Up to 4 searches per turn</text>
<g class="teal"><rect x="40" y="515" width="600" height="100" rx="12"/><text class="ts" x="628" y="533" text-anchor="end">Desktop, Ask view</text></g>
<g class="box"><rect x="60" y="555" width="320" height="48" rx="8"/><text class="th" x="220" y="572" text-anchor="middle" dominant-baseline="central">Match each [ref] to an excerpt</text><text class="ts" x="220" y="590" text-anchor="middle" dominant-baseline="central">unknown ref is dropped</text></g>
<g class="box"><rect x="420" y="555" width="200" height="48" rx="8"/><text class="th" x="520" y="572" text-anchor="middle" dominant-baseline="central">Answer on screen</text><text class="ts" x="520" y="590" text-anchor="middle" dominant-baseline="central">chips + one Sources list</text></g>
<line x1="230" y1="104" x2="253" y2="104" class="arr" marker-end="url(#arrow)"/>
<path class="path" d="M340 128 V152 H145 V206" marker-end="url(#arrow)"/>
<line x1="230" y1="232" x2="253" y2="232" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="232" x2="448" y2="232" class="arr" marker-end="url(#arrow)"/>
<line x1="145" y1="345" x2="145" y2="398" class="arr" marker-end="url(#arrow)"/>
<line x1="230" y1="414" x2="253" y2="414" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="434" x2="232" y2="434" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="414" x2="448" y2="414" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="434" x2="427" y2="434" class="arr" marker-end="url(#arrow)"/>
<line x1="145" y1="448" x2="145" y2="553" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="448" x2="370" y2="553" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="579" x2="418" y2="579" class="arr" marker-end="url(#arrow)"/>
</svg>
