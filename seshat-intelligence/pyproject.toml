[project]
name = "seshat-intelligence"
version = "0.1.0"
description = "SeshatOS's own AI capabilities server - documents now, retrieval and evaluation later, one well-organized service instead of one per feature."
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "fastapi>=0.141.1",
    "marker-pdf>=2.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seshat_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
