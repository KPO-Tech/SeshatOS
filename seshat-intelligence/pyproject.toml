[project]
name = "seshat-intelligence"
version = "0.1.0"
description = "SeshatOS's own AI capabilities server - documents now, retrieval and evaluation later, one well-organized service instead of one per feature."
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Marker code is Apache-2.0 but its model weights are free only for research, personal use and small
# companies; install it only if that fits (pip install "seshat-intelligence[marker]").
marker = ["marker-pdf>=2.0.0"]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seshat_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["benchmarks"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
# Correctness only (syntax, undefined names, unused imports) and import order: no style rules, so this
# gate fails on a real mistake and not on taste.
select = ["E4", "E7", "E9", "F", "I"]
